<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DINESH Search</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #fff; color: #202124;
    font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column;
  }
  header { height: 60px; display: flex; justify-content: flex-end; align-items: center; padding: 0 24px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 13vh 18px 40px; }
  .logo { font-size: clamp(48px, 11vw, 88px); font-weight: 600; letter-spacing: -5px; margin-bottom: 30px; }
  .logo span:nth-child(1) { color: #4285f4; }
  .logo span:nth-child(2) { color: #ea4335; }
  .logo span:nth-child(3) { color: #fbbc05; }
  .logo span:nth-child(4) { color: #4285f4; }
  .logo span:nth-child(5) { color: #34a853; }
  .logo span:nth-child(6) { color: #ea4335; }
  form { width: min(584px, 100%); }
  .search-wrap {
    height: 52px; border: 1px solid #dfe1e5; border-radius: 28px;
    display: flex; align-items: center; padding: 0 17px; gap: 12px;
    box-shadow: 0 1px 6px rgba(32,33,36,.12);
  }
  .search-wrap:focus-within { box-shadow: 0 1px 8px rgba(32,33,36,.25); }
  .search-icon { color: #9aa0a6; font-size: 19px; }
  input { border: 0; outline: 0; flex: 1; font-size: 16px; min-width: 0; color: #202124; }
  .buttons { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  button {
    border: 1px solid #f8f9fa; background: #f8f9fa; color: #3c4043;
    padding: 10px 17px; border-radius: 5px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: #dadce0; box-shadow: 0 1px 1px rgba(0,0,0,.1); }
  .note { color: #70757a; font-size: 13px; margin-top: 28px; text-align: center; }
  footer { background: #f2f2f2; color: #70757a; padding: 16px 24px; font-size: 13px; }
  @media (max-height: 600px) { main { padding-top: 7vh; } }
</style>
</head>
<body>
<header></header>
<main>
  <div class="logo" aria-label="DINESH"><span>D</span><span>I</span><span>N</span><span>E</span><span>S</span><span>H</span></div>
  <form action="https://www.google.com/search" method="GET">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" name="q" placeholder="Search the web" aria-label="Search the web" autofocus>
    </div>
    <div class="buttons">
      <button type="submit">DINESH Search</button>
      <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
    </div>
  </form>
  <div class="note">Search powered by Google</div>
</main>
<footer>Made for you · DINESH Search</footer>
</body>
</html>
